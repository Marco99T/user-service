server:
  port: 8081

spring:
  application:
    name: user-service

  datasource:
    # url: jdbc:mysql://localhost:3307/userdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    # url: jdbc:mysql://localhost:3307/userdb
    # url: jdbc:mysql://mysql-service:3306/userdb
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # ddl-auto: update
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: classpath:keys/public.pem

eureka:
  client:
    service-url:
      # defaultZone: http://localhost:8761/eureka/
      # defaultZone: http://eureka-server:8761/eureka/
      defaultZone: https://eureka-server-ufvy.onrender.com/eureka/

  instance:
    hostname: localhost
    prefer-ip-address: true

management:
  tracing:
    enabled: false