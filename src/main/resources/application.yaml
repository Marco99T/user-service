server:
  port: 8081

spring:
  application:
    name: user-service

  datasource:
    # url: jdbc:mysql://localhost:3307/userdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    # url: jdbc:mysql://localhost:3307/userdb
    # url: jdbc:mysql://mysql-service:3306/userdb
    url: ${DB_URL:jdbc:mysql://mysql-service:3306/userdb}
    username: ${DB_USERNAME:marco}
    password: ${DB_PASSWORD:123456789}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: classpath:keys/public.pem

eureka:
  client:
    service-url:
      # defaultZone: http://localhost:8761/eureka/ # LOCAL
      defaultZone: ${URL_EUREKA:http://eureka-server:8761/eureka/}
  instance:
    # hostname: user-service # Nombre del servicio para Eureka
    prefer-ip-address: true # En Docker, es mejor usar la IP para evitar problemas de resolución de nombres

management:
  tracing:
    enabled: false